<html><head><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:#fff;padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.lbl{font-size:10px;color:var(--neutral-400);width:100%;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, Card, Badge, Input, PillChip } = window.SpalDesignSystem_6a1cb4;
function Demo(){
  const [sel,setSel]=React.useState("Food");
  return (<div>
    <div className="lbl">Buttons</div>
    <div className="row">
      <Button variant="primary">Record Sale</Button>
      <Button variant="secondary">Cancel</Button>
      <Button variant="ghost">Skip</Button>
      <Button variant="danger">Delete</Button>
      <Button variant="primary" loading>Saving</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </div>
    <div className="lbl">Cards</div>
    <div className="row">
      <Card accent="green" style={{width:200}}><b style={{fontFamily:"var(--font-display)"}}>Standard card</b><p style={{fontSize:13,color:"var(--neutral-500)"}}>Sparing use, subtle border.</p></Card>
      <Card elevated style={{width:200}}><b style={{fontFamily:"var(--font-display)"}}>Elevated</b><p style={{fontSize:13,color:"var(--neutral-500)"}}>Sheets & popovers.</p></Card>
    </div>
    <div className="lbl">Badges</div>
    <div className="row">
      <Badge label="Owing" color="orange" dot/>
      <Badge label="Paid" color="green" dot/>
      <Badge label="AI" color="blue"/>
      <Badge label="Coach" color="purple"/>
      <Badge label="12 items" color="gray"/>
    </div>
    <div className="lbl">Input</div>
    <div className="row" style={{maxWidth:280}}>
      <Input large prefix="₦" placeholder="0" label="How much?"/>
    </div>
    <div className="lbl">Pill chips</div>
    <div className="row">
      {["Food","Drinks","Transport","Rent"].map(c=>(
        <PillChip key={c} label={c} color="green" selected={sel===c} onClick={()=>setSel(c)}/>
      ))}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
