<!-- @dsCard group="Type" viewport="700x170" name="Big Numbers" subtitle="Financial figures always command attention, clamp() + tabular" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--spal-bg);padding:16px 20px;display:flex;gap:10px}
.card{border-radius:var(--radius-lg);padding:16px;color:#fff;flex:1}
.lbl{font-size:12px;opacity:0.7;font-family:var(--font-display)}
.val{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
</style></head><body>
<div class="card" style="background:var(--vivid-profit)"><div class="lbl">Profit</div><div class="val" style="font-size:clamp(32px,9vw,42px)">₦48,200</div></div>
<div class="card" style="background:var(--vivid-sale)"><div class="lbl">Sale</div><div class="val" style="font-size:clamp(16px,5.5vw,22px)">₦62,000</div></div>
</body></html>
