<!-- @dsCard group="Spacing" viewport="700x260" name="Rhythm In Use" subtitle="Page padding 20px, card padding 16px, in-card gaps 4–8px" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--spal-bg);padding:20px}
.card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.dot{width:36px;height:36px;border-radius:999px;background:var(--green-50);flex-shrink:0}
.t{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--spal-navy)}
.s{font-size:11px;color:var(--neutral-400);margin-top:2px}
</style></head><body>
<div class="card"><div class="row"><div class="dot"></div><div><div class="t">Suya, Drinks</div><div class="s">Today · 2:45 PM</div></div></div></div>
<div class="card"><div class="row"><div class="dot" style="background:var(--orange-50)"></div><div><div class="t">Fuel</div><div class="s">Today · 1:10 PM</div></div></div></div>
</body></html>
