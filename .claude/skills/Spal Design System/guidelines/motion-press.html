<!-- @dsCard group="Motion" viewport="700x160" name="Tactile Press States" subtitle="Scale down on press, 0.96–0.98, 120–150ms, no color flash" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-display);background:var(--spal-bg);padding:20px;display:flex;gap:12px;align-items:center}
button{border:none;cursor:pointer;font-family:var(--font-display);font-weight:700;transition:transform 0.12s var(--ease-flow)}
button:active{transform:scale(0.96)}
.primary{background:var(--spal-green);color:#fff;height:48px;padding:0 22px;border-radius:999px;box-shadow:var(--shadow-btn-primary)}
.icon{width:44px;height:44px;border-radius:999px;background:#fff;box-shadow:var(--shadow-avatar)}
.cta{background:var(--spal-navy);color:#fff;height:52px;padding:0 26px;border-radius:999px}
.cta:active{transform:scale(0.98)}
p{font-family:var(--font-body);font-size:10px;color:var(--neutral-400);margin:6px 0 0}
</style></head><body>
<div><button class="primary">Record Sale</button><p>press me, scale 0.96</p></div>
<div><button class="icon">⚙</button></div>
<div><button class="cta">Get Started</button><p>press me, scale 0.98</p></div>
</body></html>
