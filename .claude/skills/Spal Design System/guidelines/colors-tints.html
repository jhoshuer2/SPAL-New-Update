<!-- @dsCard group="Colors" viewport="700x210" name="Accent Tints" subtitle="50/100/200 backgrounds, 500/600/700 text & fills" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px 20px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.label{width:56px;font-size:11px;color:var(--neutral-500);font-weight:600}
.sw{flex:1;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
</style></head><body>
<div class="row"><span class="label">Green</span>
<div class="sw" style="background:var(--green-50);color:var(--green-700)">50</div>
<div class="sw" style="background:var(--green-100);color:var(--green-700)">100</div>
<div class="sw" style="background:var(--green-200);color:var(--green-700)">200</div>
<div class="sw" style="background:var(--green-500);color:#fff">500</div>
<div class="sw" style="background:var(--green-600);color:#fff">600</div>
<div class="sw" style="background:var(--green-700);color:#fff">700</div></div>
<div class="row"><span class="label">Blue</span>
<div class="sw" style="background:var(--blue-50);color:var(--blue-600)">50</div>
<div class="sw" style="background:var(--blue-100);color:var(--blue-600)">100</div>
<div class="sw" style="background:#fff"></div>
<div class="sw" style="background:var(--blue-500);color:#fff">500</div>
<div class="sw" style="background:var(--blue-600);color:#fff">600</div>
<div class="sw" style="background:#fff"></div></div>
<div class="row"><span class="label">Orange</span>
<div class="sw" style="background:var(--orange-50);color:var(--orange-700)">50</div>
<div class="sw" style="background:var(--orange-100);color:var(--orange-700)">100</div>
<div class="sw" style="background:#fff"></div>
<div class="sw" style="background:var(--orange-500);color:#fff">500</div>
<div class="sw" style="background:var(--orange-600);color:#fff">600</div>
<div class="sw" style="background:var(--orange-700);color:#fff">700</div></div>
<div class="row"><span class="label">Purple</span>
<div class="sw" style="background:var(--purple-50);color:var(--purple-600)">50</div>
<div class="sw" style="background:var(--purple-100);color:var(--purple-600)">100</div>
<div class="sw" style="background:#fff"></div>
<div class="sw" style="background:var(--purple-500);color:#fff">500</div>
<div class="sw" style="background:var(--purple-600);color:#fff">600</div>
<div class="sw" style="background:#fff"></div></div>
</body></html>
