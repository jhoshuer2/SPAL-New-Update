<!-- @dsCard group="Motion" viewport="700x190" name="Easing, Flow, Never Bounce" subtitle="easeOut / custom cubic only. No spring physics." -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px 20px}
.row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.track{flex:1;height:4px;background:var(--neutral-100);border-radius:2px;position:relative}
.dot{position:absolute;top:-4px;width:12px;height:12px;border-radius:999px;background:var(--spal-green);animation:go 2.2s infinite}
.lbl{width:170px;font-size:11px;font-weight:600;color:var(--neutral-600)}
@keyframes go{0%{left:0}50%{left:calc(100% - 12px)}100%{left:0}}
.e1 .dot{animation-timing-function:cubic-bezier(0.4,0,0.2,1)}
.e2 .dot{animation-timing-function:cubic-bezier(0.22,1,0.36,1)}
.e3 .dot{animation-timing-function:cubic-bezier(0.34,1.2,0.64,1)}
</style></head><body>
<div class="row e1"><span class="lbl">ease-flow (default)</span><div class="track"><div class="dot"></div></div></div>
<div class="row e2"><span class="lbl">ease-out-soft (entrances)</span><div class="track"><div class="dot"></div></div></div>
<div class="row e3"><span class="lbl">ease-delight (celebrations)</span><div class="track"><div class="dot"></div></div></div>
</body></html>
