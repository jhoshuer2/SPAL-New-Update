<html><head><link rel="stylesheet" href="../styles.css"><style>

<div class="sw" style="width:70px;height:70px;border-radius:var(--radius-md)">md 18</div>
<div class="sw" style="width:70px;height:70px;border-radius:var(--radius-lg)">lg 20</div>
<div class="sw" style="width:70px;height:70px;border-radius:var(--radius-xl)">xl 24</div>
