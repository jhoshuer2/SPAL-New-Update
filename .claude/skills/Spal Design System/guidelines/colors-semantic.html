<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Surfaces" subtitle="Owed, healthy, low-stock, out-of-stock states" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px 20px;display:flex;gap:10px}
.card{flex:1;border-radius:14px;padding:14px;font-size:11px}
.card b{font-family:var(--font-display);font-size:13px;display:block;margin-bottom:4px}
</style></head><body>
<div class="card" style="background:var(--surface-owed-bg);color:var(--surface-owed-text);border:1px solid var(--surface-owed-border)"><b>Owed to you</b>Sage tint, money not yet received</div>
<div class="card" style="background:var(--surface-healthy-bg);color:var(--surface-healthy-text)"><b>Healthy stock</b>Green tint, inventory OK</div>
<div class="card" style="background:var(--surface-low-bg);color:var(--surface-low-text)"><b>Low stock</b>Orange tint, reorder soon</div>
<div class="card" style="background:var(--surface-out-bg);color:var(--surface-out-text)"><b>Out of stock</b>Red tint, needs attention</div>
</body></html>
